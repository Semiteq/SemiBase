name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # fetch-depth: 0 is load-bearing. At a finite depth actions/checkout
      # fetches the tag by SHA and leaves a LIGHTWEIGHT tag behind, which
      # throws the annotation away and drops every release to the fallback
      # text without failing anything.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CI runs the race detector on both platforms for every push to master.
      # This is the guard against tagging a commit that never reached master.
      - name: Test
        run: go test ./...

      # The release is named after the tag and nothing else. The whole annotated
      # tag message becomes the body, verbatim - its blank lines separate the
      # sections and collapsing them would run the whole thing into one block.
      - name: Read the tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # objecttype is the only reliable test. A lightweight tag is a bare
          # ref onto the commit, so %(contents) silently resolves to the COMMIT
          # message - trailers and all - instead of returning nothing.
          BODY=""
          if [ "$(git tag -l --format='%(objecttype)' "$TAG")" = tag ]; then
            BODY=$(git tag -l --format='%(contents)' "$TAG")
          fi
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Release $TAG"
          fi

          # A random delimiter: a body containing the literal delimiter line
          # would otherwise close the value early and leave its remaining
          # lines to be read as further outputs, overriding the ones above.
          # printf, not echo, so a body opening with -n or -e stays intact.
          DELIMITER="RELEASE_NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$DELIMITER"
            printf '%s\n' "$BODY"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      # The module is pure pgx with no cgo, so one runner cross-compiles both
      # targets. Native-platform coverage is CI's job, not the release's.
      - name: Build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          build() {
            goos="$1"
            goarch="$2"
            extension="$3"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.revision=$TAG" \
              -o "dist/semibase_${VERSION}_${goos}_${goarch}${extension}" ./cmd/semibase
          }
          # no extension on linux - an ELF is executable by its mode bit
          build windows amd64 .exe
          build linux amd64 ""

          # The image gets a copy of the linux artifact under the plain name the
          # Dockerfile expects, in a directory of its own: the release attaches
          # dist/*, and an unversioned duplicate in there would be attached too.
          # A copy rather than a second build, so the bytes in the image and the
          # bytes on the release page are provably the same binary.
          mkdir -p image
          cp "dist/semibase_${VERSION}_linux_amd64" image/semibase
          ls -l dist image

      # Pinned to a commit, not a tag: this is the one third-party action that
      # runs with the job's contents: write token, so a moved tag in its
      # repository would be a write-capable supply chain change.
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.tag.outputs.body }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*

      # After the release, never before: SemiPlot's bench tracks :latest and its
      # CI still downloads the release assets, so an image published first would
      # leave a window where :latest names a version whose assets do not exist.
      #
      # docker login rather than docker/login-action: the action would be a
      # third-party step holding a write-capable token, and the CLI needs no
      # such trust for one command.
      - name: Publish the container image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # ghcr.io accepts lowercase names only, and the owner is not lowercase
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          docker build -f Dockerfile -t "$IMAGE:$TAG" image
          docker push "$IMAGE:$TAG"

          # semver: everything after the first hyphen is a prerelease, so
          # v1.2.3-rc1 publishes its own tag and leaves :latest where it is
          case "$TAG" in
            *-*) echo "prerelease $TAG: :latest not moved" ;;
            *)
              docker tag "$IMAGE:$TAG" "$IMAGE:latest"
              docker push "$IMAGE:latest"
              ;;
          esac
