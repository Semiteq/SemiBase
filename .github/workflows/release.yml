name: release

on:
  push:
    tags:
      - "v*"

# The group is the workflow alone, deliberately: with github.ref in it, two tags
# pushed together (git push --tags) run as separate concurrent jobs and whichever
# `docker push :latest` lands last wins. Cancelling is off for the same reason -
# a job killed between the GitHub release and the image push leaves the pair
# half-published.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.tag.outputs.image }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      newest: ${{ steps.tag.outputs.newest }}
      make_latest: ${{ steps.tag.outputs.make_latest }}
      body: ${{ steps.tag.outputs.body }}

    steps:
      # fetch-depth: 0 is load-bearing twice over. At a finite depth
      # actions/checkout fetches the tag by SHA and leaves a LIGHTWEIGHT tag
      # behind, which throws the annotation away and drops every release to the
      # fallback text without failing anything; and the :latest guard below
      # needs every other tag present to know whether this one is the newest.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CI runs the race detector on both platforms for every push to master.
      # This is the guard against tagging a commit that never reached master.
      - name: Test
        run: go test ./...

      # The release is named after the tag and nothing else. The whole annotated
      # tag message becomes the body, verbatim - its blank lines separate the
      # sections and collapsing them would run the whole thing into one block.
      - name: Read the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # ghcr.io accepts lowercase names only, and the owner is not lowercase
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          # semver: everything after the first hyphen is a prerelease. This test
          # and the newest-tag one below settle every "latest" in the release -
          # the GitHub release's prerelease and make_latest fields and the
          # image's :latest tag all read the same two answers, so the release
          # page and the registry cannot name different versions.
          case "$TAG" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          # "Latest" may only ever move forward, and two ordinary operator moves
          # walk it backwards without this test: re-running an old tag's
          # workflow from the Actions UI, and pushing two tags at once. So the
          # tag being released has to BE the newest release tag in the
          # repository, not merely a non-prerelease one. Every tag has to be
          # present for that to mean anything - checkout's fetch-depth: 0 is
          # what puts them there, and this fails loudly if they are missing.
          #
          # The comparison is git's version ordering, not a string compare:
          # -v:refname reads the numeric fields as numbers, so v0.10.0 outranks
          # v0.9.0, which "v0.10.0" > "v0.9.0" as text does not. Candidates are
          # narrowed to plain vN.N[.N...] tags, so no prerelease and no oddly
          # named tag can be the newest - which also keeps git's own ordering of
          # suffixed tags out of it, since it puts v1.0.0-rc1 AFTER v1.0.0
          # unless versionsort.suffix is configured.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG is not in the checkout, so it cannot be compared against the others"
            exit 1
          fi
          NEWEST=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+(\.[0-9]+)+$' | head -n 1 || true)
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"

          if [ "$PRERELEASE" = false ] && [ "$NEWEST" = "$TAG" ]; then
            MAKE_LATEST=true
          else
            MAKE_LATEST=false
          fi
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "$TAG: prerelease=$PRERELEASE, newest release tag=${NEWEST:-none}, latest moves=$MAKE_LATEST"

          # objecttype is the only reliable test. A lightweight tag is a bare
          # ref onto the commit, so %(contents) silently resolves to the COMMIT
          # message - trailers and all - instead of returning nothing.
          BODY=""
          if [ "$(git tag -l --format='%(objecttype)' "$TAG")" = tag ]; then
            BODY=$(git tag -l --format='%(contents)' "$TAG")
          fi
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Release $TAG"
          fi

          # A random delimiter: a body containing the literal delimiter line
          # would otherwise close the value early and leave its remaining
          # lines to be read as further outputs, overriding the ones above.
          # printf, not echo, so a body opening with -n or -e stays intact.
          DELIMITER="RELEASE_NOTES_$(openssl rand -hex 16)"
          {
            echo "body<<$DELIMITER"
            printf '%s\n' "$BODY"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      # The module is pure Go with no cgo, so one runner cross-compiles both
      # targets. Native-platform coverage is CI's job, not the release's.
      - name: Build
        env:
          CGO_ENABLED: "0"
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          build() {
            goos="$1"
            goarch="$2"
            extension="$3"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.revision=$TAG" \
              -o "dist/semibase_${VERSION}_${goos}_${goarch}${extension}" ./cmd/semibase
          }
          # no extension on linux - an ELF is executable by its mode bit
          build windows amd64 .exe
          build linux amd64 ""
          ls -l dist

      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  installer:
    name: Build the setup
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Build the setup
        uses: ./.github/actions/build-setup
        with:
          app-version: ${{ needs.build.outputs.version }}
          semibase-exe: ${{ github.workspace }}\dist\semibase_${{ needs.build.outputs.version }}_windows_amd64.exe

      # The only run of the shipped setup before it is published. It has to refuse,
      # since the runner's PostgreSQL is not this job's to change, and every refusal
      # first copies the carried semibase.exe out, so that copy's version is the
      # shipped binary's.
      - name: Smoke-run the setup
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\installer-case.ps1"
          if (Test-Path Env:SEMIBASE_SUPER_PASSWORD) { Fail 'SEMIBASE_SUPER_PASSWORD is set, so the setup would not refuse' }
          Assert-Refused (Invoke-Setup) 'No superuser password'
          $version = & $ToolExe version
          if ($LASTEXITCODE -ne 0 -or "$version".Trim() -ne $env:TAG) { Fail "the carried semibase.exe prints '$version' (want $env:TAG)" }

      - name: Upload the setup
        uses: actions/upload-artifact@v7
        with:
          name: setup
          path: Installer/Output/SemiBase-Setup.exe
          if-no-files-found: error

  release:
    name: Release
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Download the setup
        uses: actions/download-artifact@v8
        with:
          name: setup
          path: setup

      # Artifact transfer drops file modes, and the Dockerfile copies without
      # --chmod, so the bit is restored before the copy inherits it.
      #
      # The image gets a copy of the linux artifact under the plain name the
      # Dockerfile expects, in a directory of its own, so the build context
      # carries that one file and nothing else reaches the daemon. A copy
      # rather than a second build, so the bytes in the image and the bytes on
      # the release page are provably the same binary.
      - name: Stage the linux binary for the image
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "dist/semibase_${VERSION}_linux_amd64"
          mkdir -p image
          cp "dist/semibase_${VERSION}_linux_amd64" image/semibase
          ls -l dist setup image

      # Built before the release exists, pushed after it. The build is the half
      # that fails on a bad copy or a bad Dockerfile, and it has to fail while
      # there is still nothing published to withdraw.
      - name: Build the container image
        env:
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile -t "$IMAGE:$TAG" image

          # The only run of the shipped Linux binary anywhere. CI's smoke check runs a
          # binary built without -trimpath and without -s -w, so it exercises a
          # different artifact than the one consumers pull.
          docker run --rm "$IMAGE:$TAG" version

          # provisioning.md states the image is linux/amd64, and FROM scratch
          # otherwise takes its manifest from whatever built it. --platform is
          # the only thing that sets it - a FROM --platform= pin does not, since
          # scratch carries no config for the output to inherit - so the claim
          # is read back off the built image rather than trusted.
          PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG")
          echo "image platform: $PLATFORM"
          if [ "$PLATFORM" != linux/amd64 ]; then
            echo "::error::image manifest says $PLATFORM, not linux/amd64"
            exit 1
          fi

      # Pinned to a commit, not a tag: this is the one third-party action that
      # runs with the job's contents: write token, so a moved tag in its
      # repository would be a write-capable supply chain change.
      #
      # The Windows binary is not attached: the setup carries it.
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          body: ${{ needs.build.outputs.body }}
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            dist/semibase_${{ needs.build.outputs.version }}_linux_amd64
            setup/SemiBase-Setup.exe

      # After the release, never before: :latest is the publish consumers act
      # on, and the release page is its record. A push that lands while the
      # release step fails leaves :latest on a version with no release and no
      # notes, and nobody re-runs a push that worked.
      #
      # docker login rather than docker/login-action: the action would be a
      # third-party step holding a write-capable token, and the CLI needs no
      # such trust for one command.
      - name: Publish the container image
        env:
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          NEWEST: ${{ needs.build.outputs.newest }}
          MOVE_LATEST: ${{ needs.build.outputs.make_latest }}
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # on a trap, so the credential leaves ~/.docker/config.json on the
          # skip and failure paths too, not only on the one that runs to the end
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          docker push "$IMAGE:$TAG"

          # The same answer the GitHub release's make_latest was set from, so
          # :latest and /releases/latest move together or not at all. A skipped
          # push says why; it is never silent.
          if [ "$MOVE_LATEST" != true ]; then
            if [ "$PRERELEASE" = true ]; then
              echo ":latest not moved: $TAG is a prerelease"
            else
              echo ":latest not moved: $TAG is not the newest release tag (${NEWEST:-none} is)"
            fi
            exit 0
          fi

          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo ":latest now names $TAG"
