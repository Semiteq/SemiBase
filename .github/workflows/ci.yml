name: CI

# push is limited to master so a same-repo pull request runs once (the
# pull_request event), not twice.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # sc.exe start returns while the service is Start Pending; run site at once
      # with no readiness wait, so openService's own wait is what runs. The
      # sequence is in docs/architecture/provisioning.md#the-service-restart.
      - name: Restart the runner's PostgreSQL service through site
        env:
          SEMIBASE_SUPER_PASSWORD: root
          SEMIBASE_WRITER_PASSWORD: ci-writer
          SEMIBASE_PLOT_PASSWORD: ci-plot
          PGPASSWORD: root
        run: |
          $service = 'postgresql-x64-17'
          $psql = "$env:PGBIN\psql.exe"
          Get-CimInstance Win32_Service -Filter "Name='$service'" |
            Select-Object Name, State, StartMode, PathName | Format-List
          go build -o semibase.exe ./cmd/semibase
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # stdout and stderr joined into one string: -like over an array filters
          # elements instead of answering yes or no
          function Invoke-Site([string] $name) {
            $ErrorActionPreference = 'Continue'
            $lines = & .\semibase.exe site --port 5432 --expected-major 17 --restart-service $name 2>&1 |
              ForEach-Object { "$_" }
            $lines | Write-Host
            [pscustomobject]@{ Code = $LASTEXITCODE; Output = $lines -join "`n" }
          }
          function Assert-Refused($run, [string] $reason) {
            if ($run.Code -ne 1 -or $run.Output -notlike "*$reason*" -or $run.Output -like '*ALTER SYSTEM SET*') {
              Write-Host "::error::want exit 1 with '$reason' and no ALTER SYSTEM SET, got exit $($run.Code)"
              exit 1
            }
          }

          Assert-Refused (Invoke-Site $service) "service $service is Disabled"

          Set-Service $service -StartupType Manual
          sc.exe start $service
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "state after sc.exe start: $((Get-Service $service).Status)"

          $first = Invoke-Site $service
          if ($first.Code -ne 0) { Write-Host "::error::the first site run exited $($first.Code)"; exit 1 }
          if ($first.Output -notlike "*restarting service $service*") {
            Write-Host "::error::the first site run did not restart $service"
            exit 1
          }
          if ($first.Output -notlike "*service $service runs data directory C:\PostgreSQL\17\data, as the server on *:5432 does*") {
            Write-Host "::error::the first site run did not tie $service to the server on port 5432"
            exit 1
          }
          if ($first.Output -notlike "*service $service stopped, nothing answers on *:5432*") {
            Write-Host "::error::the first site run did not see the old server's port refused before the Start"
            exit 1
          }

          Write-Host "data_directory: $(& $psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SHOW data_directory')"
          $listen = & $psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SHOW listen_addresses'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $pending = & $psql -h 127.0.0.1 -U postgres -d postgres -tAc `
            'SELECT count(*) FROM pg_settings WHERE pending_restart'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ("$listen".Trim() -ne 'localhost' -or "$pending".Trim() -ne '0') {
            Write-Host "::error::listen_addresses '$listen' (want localhost), pending_restart count '$pending' (want 0)"
            exit 1
          }

          $second = Invoke-Site $service
          if ($second.Code -ne 0) { Write-Host "::error::the second site run exited $($second.Code)"; exit 1 }
          if ($second.Output -like '*restarting service*') {
            Write-Host "::error::the second site run restarted $service with nothing pending"
            exit 1
          }

          Assert-Refused (Invoke-Site 'no-such-service') 'service no-such-service does not exist'
          # the runner exits with the last native exit code, which the refusal left at 1
          exit 0

  # Throwaway probe for task 1 of docs/plans/20261019-windows-installer.md.
  edb-probe:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Probe the EDB PostgreSQL 17 installer
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-17.11-5-windows-x64.exe'
          $wantHash = '612C7F5400A003AAFFA0372CB273EED52278F93C680AB911EB9CB2229E329072'
          $work = "$env:RUNNER_TEMP\edb"
          New-Item -ItemType Directory -Path $work | Out-Null
          $exe = "$work\postgresql-17.11-5-windows-x64.exe"
          $root = 'C:\Program Files\PostgreSQL\17'
          $data = "$root\data"

          function Section([string] $title) { Write-Host "`n===== $title" }
          function Dump-Registry {
            foreach ($key in 'HKLM:\SOFTWARE\PostgreSQL', 'HKLM:\SOFTWARE\WOW6432Node\PostgreSQL') {
              if (-not (Test-Path $key)) { Write-Host "$key absent"; continue }
              Get-ChildItem $key -Recurse | ForEach-Object {
                $k = $_
                Write-Host $k.Name
                foreach ($n in $k.GetValueNames()) {
                  Write-Host ("  {0} = {1} ({2})" -f $n, $k.GetValue($n), $k.GetValueKind($n))
                }
              }
            }
            Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
              Where-Object { $_.PSChildName -like '*PostgreSQL*' } |
              ForEach-Object { Write-Host "uninstall entry: $($_.Name)" }
          }
          function Dump-Services {
            Get-CimInstance Win32_Service -Filter "Name LIKE 'postgresql%'" |
              Select-Object Name, State, StartMode, StartName, PathName | Format-List | Out-String | Write-Host
          }
          function Run-Exe([string] $file, [string] $arguments, [int] $timeoutSeconds, [string] $stdout) {
            $start = Get-Date
            $p = if ($stdout) {
              Start-Process -FilePath $file -ArgumentList $arguments -PassThru -NoNewWindow `
                -RedirectStandardOutput $stdout -RedirectStandardError "$stdout.err"
            } else {
              Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            }
            $null = $p.Handle
            if (-not $p.WaitForExit($timeoutSeconds * 1000)) {
              Stop-Process -Id $p.Id -Force
              Write-Host "TIMEOUT after $timeoutSeconds s: $file $arguments"
              return 'timeout'
            }
            Write-Host ("exit {0} after {1:n0} s: {2}" -f $p.ExitCode, ((Get-Date) - $start).TotalSeconds, $arguments)
            return $p.ExitCode
          }
          function Find-Token([string] $token) {
            $roots = @($env:TEMP, 'C:\Windows\Temp', $work, "$root\installer", "$data\log")
            $files = @("$data\postgresql.conf", "$data\postgresql.auto.conf", "$data\pg_hba.conf")
            foreach ($r in $roots) {
              if (Test-Path $r) {
                $files += (Get-ChildItem $r -Recurse -File -Force -ErrorAction SilentlyContinue |
                  Where-Object { $_.Extension -ne '.exe' }).FullName
              }
            }
            $existing = @($files | Where-Object { $_ -and (Test-Path -LiteralPath $_) })
            $hits = Select-String -LiteralPath $existing -SimpleMatch -Pattern $token -ErrorAction SilentlyContinue
            $control = Select-String -LiteralPath $existing -SimpleMatch -Pattern 'initcluster' -List -ErrorAction SilentlyContinue
            Write-Host "token hits: $(@($hits).Count) over $($existing.Count) files; files naming initcluster (control): $(@($control).Count)"
            $control | ForEach-Object { Write-Host "  control file: $($_.Path)" }
            $hits | ForEach-Object { Write-Host "TOKEN HIT $($_.Path):$($_.LineNumber)" }
          }
          function Start-CommandLineWatch([string] $token) {
            Start-Job -ArgumentList $token -ScriptBlock {
              param($t)
              $seen = @{}
              while ($true) {
                Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                  Where-Object { $_.CommandLine -and $_.CommandLine.Contains($t) } |
                  ForEach-Object {
                    $line = "$($_.Name): $($_.CommandLine.Replace($t, '<TOKEN>'))"
                    if (-not $seen[$line]) { $seen[$line] = 1; $line }
                  }
                Start-Sleep -Milliseconds 200
              }
            }
          }
          function Install-Edb([string] $token, [string] $label) {
            Section "install $label"
            $optionFile = "$work\options-$label.txt"
            $options = @('serverport=5432', 'servicename=postgresql-x64-17', 'locale=C', "datadir=$data")
            if ($token) { $options = @("superpassword=$token") + $options }
            $options | Set-Content -Path $optionFile -Encoding ascii
            $watch = Start-CommandLineWatch $(if ($token) { $token } else { 'no-token-to-watch' })
            Run-Exe $exe "--mode unattended --unattendedmodeui none --optionfile `"$optionFile`" --disable-components pgAdmin,stackbuilder" 1500 | Out-Null
            if (-not (Get-Service postgresql* -ErrorAction SilentlyContinue)) {
              Write-Host 'no service after the install: retrying without --disable-components'
              Run-Exe $exe "--mode unattended --unattendedmodeui none --optionfile `"$optionFile`"" 1500 | Out-Null
            }
            Stop-Job $watch
            $pending = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager').PendingFileRenameOperations
            Write-Host "PendingFileRenameOperations entries: $(@($pending).Count)"
            Write-Host "command lines carrying the password during the install:"
            Receive-Job $watch | ForEach-Object { Write-Host "  $_" }
            Write-Host "option file still exists: $(Test-Path $optionFile)"
            Dump-Services
            Dump-Registry
            Write-Host "components: $((Get-ChildItem $root -Name) -join ', ')"
            Get-ChildItem $env:TEMP, 'C:\Windows\Temp' -Recurse -File -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '*postgres*' -or $_.Name -like 'bitrock*' -or $_.Name -like '*.log' } |
              ForEach-Object { Write-Host "temp file: $($_.FullName) $($_.Length)" }
            if ($token) { Find-Token $token }
            Get-ChildItem $env:TEMP -Filter 'install-postgresql.log' -ErrorAction SilentlyContinue | Get-Content |
              Select-String -Pattern 'initcluster|initdb|error|password|exit code|Die\(' |
              Select-Object -Last 30 |
              ForEach-Object { Write-Host "  install log: $(if ($token) { $_.Line.Replace($token, '<TOKEN>') } else { $_.Line })" }
            $env:PGPASSWORD = $token
            $psql = "$root\bin\psql.exe"
            & $psql -w -h 127.0.0.1 -U postgres -d postgres -c 'SELECT version()' -c 'SHOW server_encoding' `
              -c 'SHOW listen_addresses' -c 'SHOW port' -c 'SHOW data_directory' -c 'SHOW lc_messages' `
              -c 'SELECT datname, datcollate, datctype, datlocprovider, pg_encoding_to_char(encoding) FROM pg_database' `
              -c 'SELECT rolname, rolsuper FROM pg_roles WHERE rolname !~ ''^pg_''' 2>&1 |
              ForEach-Object { Write-Host "  $_" }
            Write-Host "psql exit: $LASTEXITCODE"
            Write-Host "pg_hba.conf rules:"
            Get-Content "$data\pg_hba.conf" | Where-Object { $_ -and $_ -notmatch '^\s*#' } | ForEach-Object { Write-Host "  $_" }
          }
          function Wait-Uninstaller([int[]] $before) {
            $start = Get-Date
            $deadline = $start.AddMinutes(10)
            $seen = @{}
            $quiet = 0
            while ((Get-Date) -lt $deadline -and $quiet -lt 5) {
              $busy = @(Get-CimInstance Win32_Process | Where-Object {
                $before -notcontains $_.ProcessId -and (
                  $_.Name -like '*uninstall*' -or $_.Name -like '*.tmp' -or
                  ($_.ExecutablePath -and ($_.ExecutablePath -like '*\Temp\*' -or $_.ExecutablePath -like '*\PostgreSQL\*')))
              })
              foreach ($p in $busy) {
                $k = "$($p.ProcessId) $($p.Name) $($p.ExecutablePath)"
                if (-not $seen[$k]) { $seen[$k] = 1; Write-Host "  uninstaller process: $k" }
              }
              if ($busy.Count -eq 0) { $quiet++ } else { $quiet = 0 }
              Start-Sleep -Seconds 1
            }
            Write-Host ("uninstaller processes gone after {0:n0} s" -f ((Get-Date) - $start).TotalSeconds)
          }
          function Remove-Edb([string] $label) {
            Section "remove $label"
            Write-Host "files in ${root}: $((Get-ChildItem $root -Name -ErrorAction SilentlyContinue) -join ', ')"
            $before = @(Get-Process | ForEach-Object Id)
            Run-Exe "$root\uninstall-postgresql.exe" '--mode unattended --unattendedmodeui none' 900 | Out-Null
            Write-Host 'right after the uninstaller exited:'
            Dump-Services
            Wait-Uninstaller $before
            Write-Host 'after its processes ended:'
            Dump-Services
            Dump-Registry
            foreach ($p in $data, $root, 'C:\PostgreSQL\17\data') {
              if (Test-Path $p) { Write-Host "left: $p ($((Get-ChildItem $p -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object).Count) entries)" }
            }
            Get-ChildItem $env:TEMP -Filter 'uninstall-postgresql.log' -ErrorAction SilentlyContinue |
              Get-Content -Tail 15 | ForEach-Object { Write-Host "  uninstall log: $_" }
            foreach ($s in @(Get-Service postgresql* -ErrorAction SilentlyContinue)) {
              Write-Host "deleting leftover service $($s.Name)"
              Stop-Service $s.Name -Force -ErrorAction SilentlyContinue
              sc.exe delete $s.Name | Out-Null
            }
            Remove-Item -Recurse -Force 'C:\PostgreSQL', 'C:\Program Files\PostgreSQL', 'HKLM:\SOFTWARE\PostgreSQL' -ErrorAction SilentlyContinue
            Write-Host "after cleanup: services $(@(Get-Service postgresql* -ErrorAction SilentlyContinue).Count), registry $(Test-Path HKLM:\SOFTWARE\PostgreSQL), program files $(Test-Path 'C:\Program Files\PostgreSQL')"
          }

          Section 'runner state'
          [System.Environment]::OSVersion.VersionString
          Write-Host "machine PGUSER=$([Environment]::GetEnvironmentVariable('PGUSER', 'Machine')) PGPASSWORD set: $([bool][Environment]::GetEnvironmentVariable('PGPASSWORD', 'Machine'))"
          Write-Host "ANSI code page: $((Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage).ACP)"
          Dump-Services
          Dump-Registry

          Section 'download'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "sha256 $hash, matches the pin: $($hash -eq $wantHash), size $((Get-Item $exe).Length)"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "signature $($sig.Status): $($sig.SignerCertificate.Subject)"

          Remove-Edb 'the runner install'

          $groups = [ordered]@{
            'shell' = 'Aa1 ''`$!;^&|<>()*?z'
            'percent' = 'Aa1%PATH%z'
            'quote' = 'Aa1"z'
            'punctuation' = 'Aa1-_.,:@#+=~/[]{}\z'
            'trailing-backslash' = 'Aa1z\'
          }
          foreach ($name in $groups.Keys) {
            Install-Edb $groups[$name] $name
            Write-Host "RESULT ${name}: service $(@(Get-Service postgresql* -ErrorAction SilentlyContinue | Where-Object Status -eq 'Running').Count) running, psql exit $LASTEXITCODE"
            Remove-Edb $name
          }
          exit 0

  linux:
    runs-on: ubuntu-latest
    env:
      SEMIBASE_SUPER_PASSWORD: ci-super
      SEMIBASE_WRITER_PASSWORD: ci-writer
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-super
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # The site path, the only thing that covers the ALTER SYSTEM tuning: the
      # same binary provisions the service container the way it provisions an
      # installation machine. Run twice to prove idempotency - the second run
      # finds every object in place and still exits on a passing access check.
      - name: Provision the service container
        env:
          SEMIBASE_PLOT_PASSWORD: ci-plot
        run: |
          go build -o semibase ./cmd/semibase
          ./semibase site --database semiplot_dev --expected-major 17
          ./semibase site --database semiplot_dev --expected-major 17

      # The service container is never restarted, so the loopback-only value
      # stays pending.
      - name: Require the listen_addresses delta
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci-super
        run: |
          set -euo pipefail
          pending=$(psql -d postgres -tAc \
            "SELECT pending_restart FROM pg_settings WHERE name = 'listen_addresses'")
          written=$(psql -d postgres -tAc \
            "SELECT setting FROM pg_file_settings WHERE name = 'listen_addresses'
               AND sourcefile LIKE '%postgresql.auto.conf'")
          if [[ "$pending" != t || "$written" != localhost ]]; then
            echo "::error::listen_addresses pending_restart '$pending' (want t), auto.conf value '$written' (want localhost)"
            exit 1
          fi

      # Every other step runs semiplot_register_new_pens() over an empty
      # public.trends, so its INSERT adds nothing.
      - name: Register pens and probe the semiplot_tags constraints
        env:
          PGHOST: localhost
          PGDATABASE: semiplot_dev
        run: |
          set -euo pipefail
          as_writer() { PGUSER=scada_writer PGPASSWORD=ci-writer psql -v ON_ERROR_STOP=1 -qtAc "$1"; }
          as_plot() { PGUSER=semiplot PGPASSWORD=ci-plot psql -v ON_ERROR_STOP=1 -qtAc "$1"; }
          as_writer "CREATE TABLE public.tp2026m01d01 PARTITION OF public.trends
              FOR VALUES FROM ('2026-01-01') TO ('2026-01-02');
            INSERT INTO public.trends (id, l, t, v, q) VALUES
              (0, 0, '2026-01-01 00:00:00', 1.5, 192), (0, 0, '2026-01-01 00:00:01', 1.6, 192),
              (13, 0, '2026-01-01 00:00:00', 20, 192), (40, 1, '2026-01-01 00:01:00', 7, 192)"
          first=$(as_plot 'SELECT semiplot_register_new_pens()')
          second=$(as_plot 'SELECT semiplot_register_new_pens()')
          pens=$(as_plot "SELECT string_agg(concat_ws(' ', id, name, color, enabled_on_start, log_scale_on_start), ','
            ORDER BY id) FROM semiplot_tags")
          want='0 0 #4E79A7 f f,13 13 #F28E2B f f,40 40 #59A14F f f'
          if [[ "$first" != 3 || "$second" != 0 || "$pens" != "$want" ]]; then
            echo "::error::first call '$first' (want 3), second '$second' (want 0), pens '$pens' (want '$want')"
            exit 1
          fi
          constraints=$(cat <<'SQL'
          DO $$
          BEGIN
            UPDATE semiplot_tags SET scale_min_on_start = 1, scale_max_on_start = 10 WHERE id = 0;
            IF NOT FOUND THEN
              RAISE EXCEPTION 'pen 0 is missing';
            END IF;
            BEGIN
              UPDATE semiplot_tags SET scale_min_on_start = 5, scale_max_on_start = NULL WHERE id = 0;
              RAISE EXCEPTION 'semiplot_tags accepted the scale bounds (5, NULL)';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE semiplot_tags SET scale_min_on_start = 5, scale_max_on_start = 1 WHERE id = 0;
              RAISE EXCEPTION 'semiplot_tags accepted the scale bounds (5, 1)';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE semiplot_tags SET log_scale_on_start = NULL WHERE id = 0;
              RAISE EXCEPTION 'semiplot_tags accepted a NULL log_scale_on_start';
            EXCEPTION WHEN not_null_violation THEN NULL;
            END;
          END
          $$
          SQL
          )
          as_plot "$constraints"

      # Runs after the pens step because it changes the semiplot password, which
      # that step logs in with. This is the ALTER ROLE ... PASSWORD path.
      - name: Keep the password statements out of the server log
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci-super
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          as_super() { psql -v ON_ERROR_STOP=1 -qtAc "$1"; }
          as_super "ALTER SYSTEM SET log_statement = 'all'"
          as_super 'SELECT pg_reload_conf()'
          as_super 'SELECT pg_sleep(0.5)'
          token="log-token-$(openssl rand -hex 16)"
          SEMIBASE_PLOT_PASSWORD="$token" ./semibase site --database semiplot_dev --expected-major 17
          bash .github/scripts/check-server-log.sh "${{ job.services.postgres.id }}" \
            "$token" ci-writer

      # These flags feed the next step's server-log check.
      - name: Provision a PostgreSQL 14 container, where the REVOKE bites
        env:
          SEMIBASE_PLOT_PASSWORD: ci-plot
        run: |
          set -euo pipefail
          docker run -d --name semibase-pg14 -e POSTGRES_PASSWORD=ci-super \
            -p 15434:5432 postgres:14-alpine \
            -c log_statement=all -c log_min_error_statement=error \
            -c log_min_duration_statement=0 -c log_min_duration_sample=0 \
            -c log_transaction_sample_rate=1
          bash .github/scripts/wait-for-postgres.sh semibase-pg14
          # ./semibase is the binary the service-container step built
          ./semibase bench --host 127.0.0.1 --port 15434 --database semiplot_dev --expected-major 14

      - name: Keep the CREATE ROLE password statements out of the PostgreSQL 14 log
        run: bash .github/scripts/check-server-log.sh semibase-pg14 ci-writer ci-plot

      # The socket path, which nothing else covers: the same binary, run the way
      # the official image runs an init script. During init the server has
      # listen_addresses empty and only /var/run/postgresql answers, superuser
      # auth is local trust, and the script's own "set -e" makes the entrypoint
      # abort on failure. So the container reaching a state where semiplot
      # selects over TCP proves bench completed over the socket.
      - name: Provision over a unix socket, as a postgres image init script
        env:
          SEMIBASE_PLOT_PASSWORD: ci-plot
          # postgres:17-alpine is musl. The runner has a C toolchain, so an
          # unset CGO_ENABLED defaults to 1 and links against glibc; the image
          # then reports the binary as "not found", which reads as a missing
          # file rather than a missing interpreter. release.yml builds the
          # shipped Linux artifact the same way.
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -o semibase-linux ./cmd/semibase
          if ! file semibase-linux | grep -q 'statically linked'; then
            echo "::error::semibase-linux is not statically linked, so it cannot run on Alpine"
            file semibase-linux
            exit 1
          fi
          cat > initdb-semibase.sh <<'SCRIPT'
          #!/bin/sh
          set -e
          /semibase bench --host /var/run/postgresql --database semiplot_dev --expected-major 17
          SCRIPT
          # the entrypoint sources a non-executable init script instead of running it,
          # and a binary without the bit set cannot run at all
          chmod +x semibase-linux initdb-semibase.sh
          cat > Dockerfile.initdb <<'DOCKERFILE'
          FROM postgres:17-alpine
          COPY semibase-linux /semibase
          COPY initdb-semibase.sh /docker-entrypoint-initdb.d/10-semibase.sh
          DOCKERFILE
          docker build -f Dockerfile.initdb -t semibase-initdb .
          # nothing is published: the host side of a published port is bound by
          # docker-proxy before postgres listens, so it answers a probe too early
          docker run -d --name semibase-initdb -e POSTGRES_PASSWORD=ci-super \
            -e SEMIBASE_WRITER_PASSWORD -e SEMIBASE_PLOT_PASSWORD semibase-initdb
          # TCP inside the container opens only once the init scripts have run
          bash .github/scripts/wait-for-postgres.sh semibase-initdb
          if ! docker exec -e PGPASSWORD=ci-plot semibase-initdb psql -h 127.0.0.1 \
              -U semiplot -d semiplot_dev -tAc 'select count(*) from semiplot_tags'; then
            echo "::error::provisioning over the unix socket did not complete"
            docker logs semibase-initdb
            exit 1
          fi

      # The published image, built and smoke-checked but never pushed - a broken
      # Dockerfile has to fail here rather than at tag time. It reuses the binary
      # the socket step already proved statically linked, which is what lets it
      # run at all: scratch has no loader, no shell and no libc.
      - name: Build the container image
        run: |
          set -euo pipefail
          mkdir -p image
          cp semibase-linux image/semibase
          docker build --platform linux/amd64 -f Dockerfile -t semibase:ci image
          docker run --rm semibase:ci version
