name: CI

# push is limited to master so a same-repo pull request runs once (the
# pull_request event), not twice.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  linux:
    runs-on: ubuntu-latest
    env:
      SEMIBASE_SUPER_PASSWORD: ci-super
      SEMIBASE_WRITER_PASSWORD: ci-writer
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-super
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # The site path, the only thing that covers the ALTER SYSTEM tuning: the
      # same binary provisions the service container the way it provisions an
      # installation machine. Run twice to prove idempotency - the second run
      # finds every object in place and still exits on a passing access check.
      - name: Provision the service container
        env:
          SEMIBASE_PLOT_PASSWORD: ci-plot
        run: |
          go build -o semibase ./cmd/semibase
          ./semibase site --database semiplot_dev --expected-major 17
          ./semibase site --database semiplot_dev --expected-major 17

      # Every other step runs semiplot_register_new_pens() over an empty
      # public.trends, so its INSERT adds nothing.
      - name: Register pens from the keys SCADA wrote
        env:
          PGHOST: localhost
          PGDATABASE: semiplot_dev
        run: |
          set -euo pipefail
          as_writer() { PGUSER=scada_writer PGPASSWORD=ci-writer psql -v ON_ERROR_STOP=1 -qtAc "$1"; }
          as_plot() { PGUSER=semiplot PGPASSWORD=ci-plot psql -v ON_ERROR_STOP=1 -qtAc "$1"; }
          as_writer "CREATE TABLE public.tp2026m01d01 PARTITION OF public.trends
              FOR VALUES FROM ('2026-01-01') TO ('2026-01-02');
            INSERT INTO public.trends (id, l, t, v, q) VALUES
              (0, 0, '2026-01-01 00:00:00', 1.5, 192), (0, 0, '2026-01-01 00:00:01', 1.6, 192),
              (13, 0, '2026-01-01 00:00:00', 20, 192), (40, 1, '2026-01-01 00:01:00', 7, 192)"
          first=$(as_plot 'SELECT semiplot_register_new_pens()')
          second=$(as_plot 'SELECT semiplot_register_new_pens()')
          pens=$(as_plot "SELECT string_agg(concat_ws(' ', id, name, color, enabled_on_start), ','
            ORDER BY id) FROM semiplot_tags")
          want='0 0 #4E79A7 f,13 13 #F28E2B f,40 40 #59A14F f'
          if [[ "$first" != 3 || "$second" != 0 || "$pens" != "$want" ]]; then
            echo "::error::first call '$first' (want 3), second '$second' (want 0), pens '$pens' (want '$want')"
            exit 1
          fi

      - name: Provision a PostgreSQL 14 container, where the REVOKE bites
        env:
          SEMIBASE_PLOT_PASSWORD: ci-plot
        run: |
          set -euo pipefail
          docker run -d --name semibase-pg14 -e POSTGRES_PASSWORD=ci-super \
            -p 15434:5432 postgres:14-alpine
          bash .github/scripts/wait-for-postgres.sh semibase-pg14
          # ./semibase is the binary the service-container step built
          ./semibase bench --host 127.0.0.1 --port 15434 --database semiplot_dev --expected-major 14

      # The socket path, which nothing else covers: the same binary, run the way
      # the official image runs an init script. During init the server has
      # listen_addresses empty and only /var/run/postgresql answers, superuser
      # auth is local trust, and the script's own "set -e" makes the entrypoint
      # abort on failure. So the container reaching a state where semiplot
      # selects over TCP proves bench completed over the socket.
      - name: Provision over a unix socket, as a postgres image init script
        env:
          SEMIBASE_PLOT_PASSWORD: ci-plot
          # postgres:17-alpine is musl. The runner has a C toolchain, so an
          # unset CGO_ENABLED defaults to 1 and links against glibc; the image
          # then reports the binary as "not found", which reads as a missing
          # file rather than a missing interpreter. release.yml builds the
          # shipped Linux artifact the same way.
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -o semibase-linux ./cmd/semibase
          if ! file semibase-linux | grep -q 'statically linked'; then
            echo "::error::semibase-linux is not statically linked, so it cannot run on Alpine"
            file semibase-linux
            exit 1
          fi
          cat > initdb-semibase.sh <<'SCRIPT'
          #!/bin/sh
          set -e
          /semibase bench --host /var/run/postgresql --database semiplot_dev --expected-major 17
          SCRIPT
          # the entrypoint sources a non-executable init script instead of running it,
          # and a binary without the bit set cannot run at all
          chmod +x semibase-linux initdb-semibase.sh
          cat > Dockerfile.initdb <<'DOCKERFILE'
          FROM postgres:17-alpine
          COPY semibase-linux /semibase
          COPY initdb-semibase.sh /docker-entrypoint-initdb.d/10-semibase.sh
          DOCKERFILE
          docker build -f Dockerfile.initdb -t semibase-initdb .
          # nothing is published: the host side of a published port is bound by
          # docker-proxy before postgres listens, so it answers a probe too early
          docker run -d --name semibase-initdb -e POSTGRES_PASSWORD=ci-super \
            -e SEMIBASE_WRITER_PASSWORD -e SEMIBASE_PLOT_PASSWORD semibase-initdb
          # TCP inside the container opens only once the init scripts have run
          bash .github/scripts/wait-for-postgres.sh semibase-initdb
          if ! docker exec -e PGPASSWORD=ci-plot semibase-initdb psql -h 127.0.0.1 \
              -U semiplot -d semiplot_dev -tAc 'select count(*) from semiplot_tags'; then
            echo "::error::provisioning over the unix socket did not complete"
            docker logs semibase-initdb
            exit 1
          fi

      # The published image, built and smoke-checked but never pushed - a broken
      # Dockerfile has to fail here rather than at tag time. It reuses the binary
      # the socket step already proved statically linked, which is what lets it
      # run at all: scratch has no loader, no shell and no libc.
      - name: Build the container image
        run: |
          set -euo pipefail
          mkdir -p image
          cp semibase-linux image/semibase
          docker build --platform linux/amd64 -f Dockerfile -t semibase:ci image
          docker run --rm semibase:ci version
